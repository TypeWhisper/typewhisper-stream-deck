name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run validate
      - run: npm run pack:dry-run

  package:
    needs: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package plugin
        run: npm exec -- streamdeck pack com.typewhisper.streamdeck.sdPlugin --output dist --force
      - uses: ./.github/actions/validate-package
        with:
          package-path: dist/com.typewhisper.streamdeck.streamDeckPlugin
      - name: Upload packaged plugin
        uses: actions/upload-artifact@v4
        with:
          name: typewhisper-stream-deck-${{ github.sha }}
          path: dist/com.typewhisper.streamdeck.streamDeckPlugin
          if-no-files-found: error
          retention-days: 14
