name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run validate
      - name: Package plugin
        run: npm exec -- streamdeck pack com.typewhisper.streamdeck.sdPlugin --output dist --force
      - uses: ./.github/actions/validate-package
        with:
          package-path: dist/com.typewhisper.streamdeck.streamDeckPlugin
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.streamDeckPlugin --generate-notes --title "$GITHUB_REF_NAME"
