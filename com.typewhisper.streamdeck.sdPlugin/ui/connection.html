<!doctype html>
<html>
<head lang="en">
  <meta charset="utf-8">
  <title>TypeWhisper Connection</title>
  <script src="sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="TypeWhisper">
    <sdpi-select global setting="instance" default="auto">
      <option value="auto">Auto (Stable first)</option>
      <option value="stable">Stable</option>
      <option value="development">Development</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Port override">
    <sdpi-textfield global setting="portOverride" pattern="^[0-9]{1,5}$" placeholder="Automatic"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item>
    <p>TypeWhisper must be running with its local API enabled. The token is discovered automatically and is never shown or logged.</p>
  </sdpi-item>
</body>
</html>
