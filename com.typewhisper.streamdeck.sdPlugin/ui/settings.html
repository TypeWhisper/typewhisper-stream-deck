<!doctype html>
<html>
<head lang="en">
  <meta charset="utf-8">
  <title>TypeWhisper Settings</title>
  <script src="sdpi-components.js"></script>
  <style>
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="workflow-settings" hidden>
    <sdpi-item label="Workflow">
      <sdpi-select setting="workflowId" datasource="getWorkflows" loading="Loading workflows..." placeholder="Select a workflow" hot-reload show-refresh></sdpi-select>
    </sdpi-item>
  </div>

  <div id="recorder-settings" hidden>
    <sdpi-item label="Sources">
      <sdpi-checkbox setting="microphone" default="true" label="Microphone"></sdpi-checkbox>
      <sdpi-checkbox setting="systemAudio" default="false" label="System Audio"></sdpi-checkbox>
    </sdpi-item>
    <sdpi-item>
      <p>At least one source must be enabled.</p>
    </sdpi-item>
  </div>

  <sdpi-item label="TypeWhisper">
    <sdpi-select global setting="instance" default="auto">
      <option value="auto">Auto (Stable first)</option>
      <option value="stable">Stable</option>
      <option value="development">Development</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Port override">
    <sdpi-textfield global setting="portOverride" pattern="^[0-9]{1,5}$" placeholder="Automatic"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item>
    <p>Connection settings are shared by every TypeWhisper action. The API token is discovered automatically and is never shown or logged.</p>
  </sdpi-item>

  <script>
    (() => {
      const connect = window.connectElgatoStreamDeckSocket;
      window.connectElgatoStreamDeckSocket = function (...args) {
        connect?.(...args);
        try {
          const action = JSON.parse(args[4]).action;
          document.getElementById("workflow-settings").hidden =
            action !== "com.typewhisper.streamdeck.workflow-dictation";
          document.getElementById("recorder-settings").hidden =
            action !== "com.typewhisper.streamdeck.recorder";
        } catch {
          // Keep action-specific controls hidden if Stream Deck sends incomplete context.
        }
      };
    })();
  </script>
</body>
</html>
